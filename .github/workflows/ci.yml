name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (offline: unit, integration, golden recall@5, concurrency, MCP protocol)
        run: cargo test --verbose

  release:
    name: release binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Smoke test (--check exits gracefully without a database)
        run: |
          set +e
          ./target/release/remember-mcp --check
          code=$?
          set -e
          # exit code 1 is expected in CI (no OpenCode db); the JSON must print
          test "$code" -eq 0 -o "$code" -eq 1
          ./target/release/remember-mcp --version
